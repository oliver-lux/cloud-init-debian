# Credentials Template for cloud-config
# IMPORTANT: This file is only a template!
#
# Usage:
# 1. Run: python3 build_config.py (auto-creates .private/credentials.yaml)
# 2. Fill in your values below
# 3. NEVER commit .private/credentials.yaml!
# 4. The file is automatically in .gitignore

# SSH Public Key
# Generate with: ssh-keygen -t ed25519 -C "your-email@example.com"
# Then copy: cat ~/.ssh/id_ed25519.pub
ssh_public_key: "YOUR_SSH_PUBLIC_KEY_HERE"

# User Password Hash (for sudo authentication)
# Generate with: mkpasswd -m sha-512
# Or with Python: python3 -c "import crypt; print(crypt.crypt('YOUR_PASSWORD', crypt.mksalt(crypt.METHOD_SHA512)))"
user_password_hash: "YOUR_PASSWORD_HASH_HERE"
